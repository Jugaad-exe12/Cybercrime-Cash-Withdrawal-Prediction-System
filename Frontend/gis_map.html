<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybercrime Emergency GIS Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin: 0;
            padding: 15px;
            text-align: center;
            background: #111827;
            color: white;
        }

        #map {
            height: 85vh;
            width: 100%;
        }

        .legend {
            background: white;
            padding: 12px;
            line-height: 26px;
            border-radius: 8px;
            box-shadow: 0 0 8px #777;
        }

        .legend span {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 7px;
        }
    </style>
</head>

<body>

<h2>Cybercrime Emergency Risk GIS Map</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [22.6975, 88.3700],
    11
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


// Create colored circle marker
function addRiskZone(
    latitude,
    longitude,
    color,
    title,
    description
) {

    L.circle(
        [latitude, longitude],
        {
            color: color,
            fillColor: color,
            fillOpacity: 0.55,
            radius: 1800
        }
    )
    .addTo(map)
    .bindPopup(`
        <h3 style="color:${color}">
            ${title}
        </h3>
        <p>${description}</p>
    `);


    L.circleMarker(
        [latitude, longitude],
        {
            radius: 12,
            color: "white",
            weight: 3,
            fillColor: color,
            fillOpacity: 1
        }
    )
    .addTo(map)
    .bindPopup(`
        <b>${title}</b><br>
        ${description}
    `);
}


// RED — HIGH RISK / EMERGENCY
addRiskZone(
    22.4630,
    88.3800,
    "red",
    "HIGH RISK — Garia",
    "Emergency zone. Immediate investigation required."
);


// YELLOW — MEDIUM RISK / WARNING
addRiskZone(
    22.7210,
    88.4820,
    "yellow",
    "MEDIUM RISK — Barasat",
    "Warning zone. Continuous monitoring recommended."
);


// GREEN — LOW RISK / NORMAL
addRiskZone(
    22.6330,
    88.4100,
    "green",
    "LOW RISK — Dumdum",
    "Low-risk zone. Normal monitoring."
);


// Additional green zone
addRiskZone(
    22.6975,
    88.3700,
    "green",
    "LOW RISK — Sodepur",
    "Low-risk reference location."
);


// Legend
const legend = L.control({
    position: "bottomright"
});

legend.onAdd = function() {

    const div = L.DomUtil.create(
        "div",
        "legend"
    );

    div.innerHTML = `
        <b>Emergency Risk Level</b><br>
        <span style="background:red"></span>
        High Risk / Emergency<br>

        <span style="background:yellow"></span>
        Medium Risk / Warning<br>

        <span style="background:green"></span>
        Low Risk / Normal
    `;

    return div;
};

legend.addTo(map);

</script>

</body>
</html>
